<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product Operations</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark">◆</span>
        <h1>Product Operations</h1>
      </div>
    </div>
  </header>

  <nav class="tabbar">
    <div class="tabbar-inner">
      <button class="tab-btn active" data-tab="epd-report" type="button">EPD Report</button>
      <button class="tab-btn" data-tab="sprint-report" type="button">Sprint Report</button>
      <button class="tab-btn" data-tab="project-milestones" type="button">Project Milestones</button>
    </div>
  </nav>

  <main class="container">
    <div id="error-banner" class="error-banner hidden"></div>
    <div id="success-banner" class="success-banner hidden"></div>

    <section id="tab-epd-report" class="tab-panel">
      <div class="epd-toolbar">
        <span id="notion-status" class="topbar-hint hidden"></span>
        <label class="checkbox-label" for="sprint-data-checkbox">
          <input type="checkbox" id="sprint-data-checkbox" />
          Sprint data
        </label>
        <label class="checkbox-label" for="only-star-projects-checkbox">
          <input type="checkbox" id="only-star-projects-checkbox" />
          Only Star Projects
        </label>
        <label class="checkbox-label" for="demo-run-checkbox" title="Only publish the Progress squad to Notion">
          <input type="checkbox" id="demo-run-checkbox" />
          Demo run
        </label>
        <button id="notion-disconnect-btn" class="btn-link hidden" type="button">Disconnect</button>
        <a id="notion-connect-link" class="btn btn-primary hidden" href="/notion/oauth/start">Connect to Notion</a>
        <button id="notion-btn" class="btn btn-primary hidden" type="button">
          <span class="btn-label">Publish to Notion</span>
        </button>
      </div>

      <div id="squads-container"></div>

      <div id="loading-state" class="loading-state">
        <div class="spinner"></div>
        <p>Loading dashboard…</p>
      </div>
    </section>

    <section id="tab-sprint-report" class="tab-panel hidden">
      <div class="placeholder-tab">
        <h2>Sprint Report</h2>
        <p>Coming soon.</p>
      </div>
    </section>

    <section id="tab-project-milestones" class="tab-panel hidden">
      <div class="placeholder-tab">
        <h2>Project Milestones</h2>
        <p>Coming soon.</p>
      </div>
    </section>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
